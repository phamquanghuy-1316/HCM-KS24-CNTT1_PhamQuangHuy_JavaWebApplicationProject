<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>
        Academic Profile
    </title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow border-0 rounded-4">

                <div class="card-body p-5">

                    <h2 class="fw-bold mb-4 text-primary">

                        Academic Profile

                    </h2>

                    <!-- SUCCESS -->

                    <div
                            th:if="${param.success}"

                            class="alert alert-success">

                        Academic profile updated successfully

                    </div>

                    <form

                            th:action="@{/lecturer/academic-profile}"

                            th:object="${lecturer}"

                            method="post">

                        <!-- ID -->

                        <input
                                type="hidden"

                                th:field="*{id}">

                        <!-- SPECIALIZATION -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">

                                Specialization

                            </label>

                            <input
                                    type="text"

                                    th:field="*{specialization}"

                                    class="form-control form-control-lg">

                        </div>

                        <!-- DEGREE -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">

                                Academic Degree

                            </label>

                            <input
                                    type="text"

                                    th:field="*{academicDegree}"

                                    class="form-control form-control-lg">

                        </div>

                        <!-- EXPERIENCE -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">

                                Experience Years

                            </label>

                            <input
                                    type="number"

                                    th:field="*{experienceYears}"

                                    class="form-control form-control-lg">

                        </div>

                        <button
                                class="btn btn-primary btn-lg w-100">

                            Save Academic Profile

                        </button>

                    </form>

                    <a

                            th:href="@{/lecturer/dashboard}"

                            class="btn btn-outline-secondary w-100 mt-3">

                        Back Dashboard

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
