<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>
        Equipment Management
    </title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex
                justify-content-between
                align-items-center
                mb-4">

        <h2>
            Equipment Management
        </h2>

        <a
                th:href="@{/admin/equipments/create}"
                class="btn btn-primary">

            Add Equipment

        </a>

    </div>

    <table class="table table-bordered bg-white">

        <thead class="table-dark">

        <tr>

            <th>ID</th>

            <th>Name</th>

            <th>Code</th>

            <th>Quantity</th>

            <th>Available</th>

            <th>Action</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="e : ${equipments}">

            <td th:text="${e.id}"></td>

            <td th:text="${e.name}"></td>

            <td th:text="${e.code}"></td>

            <td th:text="${e.quantity}"></td>

            <td th:text="${e.availableQuantity}"></td>

            <td>

                <a
                        th:href="@{/admin/equipments/edit/{id}(id=${e.id})}"
                        class="btn btn-warning btn-sm">

                    Edit

                </a>

                <a
                        th:href="@{/admin/equipments/delete/{id}(id=${e.id})}"
                        class="btn btn-danger btn-sm">

                    Delete

                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
