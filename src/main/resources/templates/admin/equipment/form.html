<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>
        Equipment Form
    </title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card p-4">

        <h2>
            Equipment Form
        </h2>

        <form
                th:action="@{/admin/equipments/save}"
                th:object="${equipment}"
                method="post">

            <input
                    type="hidden"
                    th:field="*{id}">

            <div class="mb-3">

                <label>
                    Name
                </label>

                <input
                        type="text"
                        th:field="*{name}"
                        class="form-control">

            </div>

            <div class="mb-3">

                <label>
                    Code
                </label>

                <input
                        type="text"
                        th:field="*{code}"
                        class="form-control">

            </div>

            <div class="mb-3">

                <label>
                    Quantity
                </label>

                <input
                        type="number"
                        th:field="*{quantity}"
                        class="form-control">

            </div>

            <div class="mb-3">

                <label>
                    Available Quantity
                </label>

                <input
                        type="number"
                        th:field="*{availableQuantity}"
                        class="form-control">

            </div>

            <div class="mb-3">

                <label>
                    Description
                </label>

                <textarea
                        th:field="*{description}"
                        class="form-control">
                </textarea>

            </div>

            <button class="btn btn-success">

                Save

            </button>

        </form>

    </div>

</div>

</body>

</html>
