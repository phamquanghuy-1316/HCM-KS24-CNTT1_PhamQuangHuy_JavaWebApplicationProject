<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>
        Admin Profile
    </title>

    <!-- BOOTSTRAP -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- FONT AWESOME -->

    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body {

            background: #f4f7fc;
        }

        .profile-container {

            max-width: 850px;

            margin: 50px auto;
        }

        .profile-card {

            border: none;

            border-radius: 25px;

            overflow: hidden;

            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .profile-header {

            background: linear-gradient(
                    135deg,
                    #0d6efd,
                    #3d8bfd
            );

            color: white;

            padding: 40px;

            text-align: center;
        }

        .profile-avatar {

            width: 120px;

            height: 120px;

            border-radius: 50%;

            background: white;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: auto;

            font-size: 55px;

            color: #0d6efd;

            margin-bottom: 20px;
        }

        .profile-body {

            padding: 40px;
        }

        .form-control {

            border-radius: 12px;

            padding: 12px;
        }

        .btn-save {

            background: linear-gradient(
                    135deg,
                    #0d6efd,
                    #3d8bfd
            );

            border: none;

            border-radius: 12px;

            padding: 12px;

            font-weight: bold;

            transition: 0.3s;
        }

        .btn-save:hover {

            transform: translateY(-2px);

            opacity: 0.9;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="profile-container">

        <div class="card profile-card">

            <!-- HEADER -->

            <div class="profile-header">

                <div class="profile-avatar">

                    <i class="fa-solid fa-user-shield"></i>

                </div>

                <h2>
                    Administrator Profile
                </h2>

                <p>
                    Manage your administrator account information
                </p>

            </div>

            <!-- BODY -->

            <div class="profile-body">

                <!-- SUCCESS MESSAGE -->

                <div
                        th:if="${param.success}"
                        class="alert alert-success">

                    Profile updated successfully

                </div>

                <form
                        th:action="@{/admin/profile}"
                        th:object="${profile}"
                        method="post">

                    <!-- ID -->

                    <input
                            type="hidden"
                            th:field="*{id}">

                    <!-- FULL NAME -->

                    <div class="mb-4">

                        <label class="form-label">

                            Full Name

                        </label>

                        <input
                                type="text"
                                th:field="*{fullName}"
                                class="form-control"
                                placeholder="Enter full name">

                    </div>

                    <!-- PHONE -->

                    <div class="mb-4">

                        <label class="form-label">

                            Phone Number

                        </label>

                        <input
                                type="text"
                                th:field="*{phone}"
                                class="form-control"
                                placeholder="Enter phone number">

                    </div>

                    <!-- ADDRESS -->

                    <div class="mb-4">

                        <label class="form-label">

                            Address

                        </label>

                        <input
                                type="text"
                                th:field="*{address}"
                                class="form-control"
                                placeholder="Enter address">

                    </div>

                    <!-- DATE OF BIRTH -->

                    <div class="mb-4">

                        <label class="form-label">

                            Date Of Birth

                        </label>

                        <input
                                type="date"
                                th:field="*{dob}"
                                class="form-control">

                    </div>

                    <!-- BUTTONS -->

                    <div class="d-flex gap-3">

                        <button
                                type="submit"
                                class="btn btn-save text-white w-100">

                            <i class="fa-solid fa-floppy-disk"></i>

                            Save Profile

                        </button>

                        <a
                                th:href="@{/admin/dashboard}"
                                class="btn btn-dark w-100">

                            <i class="fa-solid fa-arrow-left"></i>

                            Back Dashboard

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
