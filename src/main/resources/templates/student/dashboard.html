<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>
        Student Dashboard
    </title>

    <!-- BOOTSTRAP -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- ICON -->

    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body {

            background: #f4f7fc;
        }

        .sidebar {

            height: 100vh;

            background: #0d6efd;

            color: white;

            padding: 20px;
        }

        .sidebar h2 {

            font-weight: bold;

            margin-bottom: 30px;
        }

        .sidebar a {

            display: block;

            color: white;

            text-decoration: none;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 10px;

            transition: 0.3s;
        }

        .sidebar a:hover {

            background: rgba(255,255,255,0.2);
        }

        .content {

            padding: 30px;
        }

        .dashboard-card {

            border: none;

            border-radius: 20px;

            transition: 0.3s;

            cursor: pointer;
        }

        .dashboard-card:hover {

            transform: translateY(-5px);

            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .dashboard-icon {

            font-size: 40px;

            margin-bottom: 15px;

            color: #0d6efd;
        }

    </style>

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- SIDEBAR -->

        <div class="col-md-2 sidebar">

            <h2>
                Student
            </h2>

            <a th:href="@{/student/dashboard}">

                <i class="fa-solid fa-house"></i>

                Dashboard

            </a>

            <a th:href="@{/student/profile}">

                <i class="fa-solid fa-user"></i>

                My Profile

            </a>

            <a href="#">

                <i class="fa-solid fa-calendar-check"></i>

                Book Mentoring

            </a>

            <a href="#">

                <i class="fa-solid fa-xmark"></i>

                Cancel Schedule

            </a>

            <a href="#">

                <i class="fa-solid fa-clock-rotate-left"></i>

                Academic History

            </a>

            <a th:href="@{/logout}">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </a>

        </div>

        <!-- CONTENT -->

        <div class="col-md-10 content">

            <h1 class="mb-4">

                Welcome Student 👋

            </h1>

            <div class="row g-4">

                <!-- PROFILE -->

                <div class="col-md-4">

                    <div class="card dashboard-card p-4 text-center">

                        <div class="dashboard-icon">

                            <i class="fa-solid fa-user"></i>

                        </div>

                        <h4>
                            My Profile
                        </h4>

                        <p>
                            Manage your personal information
                        </p>

                        <a
                                th:href="@{/student/profile}"
                                class="btn btn-primary">

                            Open

                        </a>

                    </div>

                </div>

                <!-- BOOK -->

                <div class="col-md-4">

                    <div class="card dashboard-card p-4 text-center">

                        <div class="dashboard-icon">

                            <i class="fa-solid fa-calendar-check"></i>

                        </div>

                        <h4>
                            Book Mentoring
                        </h4>

                        <p>
                            Schedule mentoring sessions
                        </p>

                        <a
                                href="#"
                                class="btn btn-success">

                            Open

                        </a>

                    </div>

                </div>

                <!-- HISTORY -->

                <div class="col-md-4">

                    <div class="card dashboard-card p-4 text-center">

                        <div class="dashboard-icon">

                            <i class="fa-solid fa-book"></i>

                        </div>

                        <h4>
                            Academic History
                        </h4>

                        <p>
                            View mentoring history
                        </p>

                        <a
                                href="#"
                                class="btn btn-dark">

                            Open

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
