<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>
        My Profile
    </title>

    <!-- BOOTSTRAP -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- FONT AWESOME -->

    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body {

            background: linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
            );

            min-height: 100vh;
        }

        .profile-card {

            border: none;

            border-radius: 25px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.08);

            overflow: hidden;
        }

        .profile-header {

            background: linear-gradient(
                    135deg,
                    #0d6efd,
                    #4f8cff
            );

            color: white;

            padding: 40px;

            text-align: center;
        }

        .profile-header i {

            font-size: 70px;

            margin-bottom: 15px;
        }

        .profile-body {

            padding: 40px;
        }

        .form-control {

            border-radius: 12px;

            padding: 12px;
        }

        .btn-save {

            border-radius: 12px;

            padding: 12px;

            font-weight: bold;
        }

        .back-btn {

            text-decoration: none;

            font-weight: 500;
        }

    </style>

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <!-- BACK BUTTON -->

            <div class="mb-3">

                <a
                        th:href="@{/student/dashboard}"
                        class="back-btn">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back To Dashboard

                </a>

            </div>

            <!-- PROFILE CARD -->

            <div class="card profile-card">

                <!-- HEADER -->

                <div class="profile-header">

                    <i class="fa-solid fa-user-graduate"></i>

                    <h2>
                        My Profile
                    </h2>

                    <p>
                        Manage your personal information
                    </p>

                </div>

                <!-- BODY -->

                <div class="profile-body">

                    <form
                            th:action="@{/student/profile}"
                            th:object="${profile}"
                            method="post">

                        <!-- ID -->

                        <input
                                type="hidden"
                                th:field="*{id}">

                        <!-- FULL NAME -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Full Name

                            </label>

                            <input
                                    type="text"
                                    th:field="*{fullName}"
                                    class="form-control"
                                    placeholder="Enter your full name">

                        </div>

                        <!-- PHONE -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Phone Number

                            </label>

                            <input
                                    type="text"
                                    th:field="*{phone}"
                                    class="form-control"
                                    placeholder="Enter your phone number">

                        </div>

                        <!-- ADDRESS -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Address

                            </label>

                            <input
                                    type="text"
                                    th:field="*{address}"
                                    class="form-control"
                                    placeholder="Enter your address">

                        </div>

                        <!-- DATE OF BIRTH -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Date Of Birth

                            </label>

                            <input
                                    type="date"
                                    th:field="*{dob}"
                                    class="form-control">

                        </div>

                        <!-- BUTTON -->

                        <button
                                type="submit"
                                class="btn btn-primary w-100 btn-save">

                            <i class="fa-solid fa-floppy-disk"></i>

                            Save Profile

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
