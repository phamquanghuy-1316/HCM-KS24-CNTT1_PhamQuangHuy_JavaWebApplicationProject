<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Profile</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="card p-4">

        <h2>
            My Profile
        </h2>

        <form
                th:action="@{/student/profile}"
                th:object="${profile}"
                method="post">

            <input
                    type="hidden"
                    th:field="*{id}">

            <div class="mb-3">

                <label>
                    Full Name
                </label>

                <input
                        type="text"
                        th:field="*{fullName}"
                        class="form-control">

            </div>

            <div class="mb-3">

                <label>
                    Phone
                </label>

                <input
                        type="text"
                        th:field="*{phone}"
                        class="form-control">

            </div>

            <div class="mb-3">

                <label>
                    Address
                </label>

                <input
                        type="text"
                        th:field="*{address}"
                        class="form-control">

            </div>

            <div class="mb-3">

                <label>
                    Date Of Birth
                </label>

                <input
                        type="date"
                        th:field="*{dob}"
                        class="form-control">

            </div>

            <button
                    class="btn btn-primary">

                Save Profile

            </button>

        </form>

    </div>

</div>

</body>

</html>
