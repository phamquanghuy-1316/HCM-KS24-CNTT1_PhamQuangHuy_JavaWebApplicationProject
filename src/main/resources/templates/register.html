<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Register</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">
                    REGISTER
                </h2>

                <!-- GLOBAL ERROR -->

                <div
                        th:if="${error}"
                        class="alert alert-danger"
                        th:text="${error}">
                </div>

                <form
                        th:action="@{/register}"
                        th:object="${request}"
                        method="post">

                    <!-- USERNAME -->

                    <div class="mb-3">

                        <label>
                            Username
                        </label>

                        <input
                                type="text"
                                th:field="*{username}"
                                class="form-control">

                        <div
                                class="text-danger"
                                th:if="${#fields.hasErrors('username')}"
                                th:errors="*{username}">
                        </div>

                    </div>

                    <!-- EMAIL -->

                    <div class="mb-3">

                        <label>
                            Email
                        </label>

                        <input
                                type="email"
                                th:field="*{email}"
                                class="form-control">

                        <div
                                class="text-danger"
                                th:if="${#fields.hasErrors('email')}"
                                th:errors="*{email}">
                        </div>

                    </div>

                    <!-- PASSWORD -->

                    <div class="mb-3">

                        <label>
                            Password
                        </label>

                        <input
                                type="password"
                                th:field="*{password}"
                                class="form-control">

                        <div
                                class="text-danger"
                                th:if="${#fields.hasErrors('password')}"
                                th:errors="*{password}">
                        </div>

                    </div>

                    <!-- ROLE -->

                    <div class="mb-3">

                        <label>
                            Role
                        </label>

                        <select
                                th:field="*{role}"
                                class="form-select">

                            <option value="">
                                Select Role
                            </option>

                            <option value="STUDENT">
                                Student
                            </option>

                            <option value="LECTURER">
                                Lecturer
                            </option>

                        </select>

                        </select>

                    </div>

                    <button
                            type="submit"
                            class="btn btn-success w-100">

                        Register

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
