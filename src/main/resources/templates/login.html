<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Login</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-4">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">
                    LOGIN
                </h2>

                <!-- LOGIN FAILED -->

                <div
                        th:if="${error}"
                        class="alert alert-danger">

                    <span th:text="${error}"></span>

                </div>

                <form
                        th:action="@{/do-login}"
                        th:object="${loginRequest}"
                        method="post">

                    <!-- USERNAME -->

                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input
                                type="text"
                                th:field="*{username}"
                                class="form-control">

                        <!-- VALIDATE ERROR -->

                        <div
                                class="text-danger mt-1"
                                th:if="${#fields.hasErrors('username')}"
                                th:errors="*{username}">

                        </div>

                    </div>

                    <!-- PASSWORD -->

                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                                type="password"
                                th:field="*{password}"
                                class="form-control">

                        <!-- VALIDATE ERROR -->

                        <div
                                class="text-danger mt-1"
                                th:if="${#fields.hasErrors('password')}"
                                th:errors="*{password}">

                        </div>

                    </div>

                    <button
                            type="submit"
                            class="btn btn-primary w-100">

                        Login

                    </button>

                </form>

                <div class="text-center mt-3">

                    <a th:href="@{/register}">
                        Register
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
